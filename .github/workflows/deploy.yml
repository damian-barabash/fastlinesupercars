name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # `npm run build` = vite build + scripts/prerender.mjs (strony per trasa, przekierowania,
      # sitemap i własny 404.html z noindex — dlatego NIE nadpisujemy tu 404.html kopią strony głównej)
      - run: npm run build
      - name: Sprawdź, czy prerender wygenerował podstrony
        run: |
          test -f dist/oferta/index.html
          test -f dist/produkt/porsche-911/index.html
          test -f dist/sitemap.xml
          test -f dist/404.html
          grep -q "noindex" dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
